<!-- Skip to main content link for WCAG 2.2 AA accessibility -->
<a href="#main-content" class="skip-to-content sr-only">Skip to main content</a>

<!-- Main Sticky Luxury Navigation -->
<app-header></app-header>

<!-- Main Page Content Structure -->
<main id="main-content" class="main-wrapper">
  <!-- 1. Editorial Hero Section -->
  <app-hero></app-hero>

  <!-- 2. Sanctuary Philosophy & Unhurried Care (Warm Ivory Section) -->
  <app-brand-story></app-brand-story>

  <!-- 3. Curated Services (6 Signature first with expandable price list) -->
  <app-collections></app-collections>

  <!-- 4. Our Team (Approachable Indian stylists & concept badges) -->
  <app-stylists></app-stylists>

  <!-- 5. Real Transformations Gallery (Paired Before/After & Odisha Bridal) -->
  <app-transformations></app-transformations>

  <!-- 6. Client Reviews (Warm Ivory Section with honest sample tags) -->
  <app-reviews></app-reviews>

  <!-- 7. Interactive Inline Booking Suite Section (Plain 4-step wizard) -->
  <section id="booking" class="section-spacing inline-booking-section" aria-label="Book your appointment">
    <div class="container-velora">
      <div class="section-header">
        <span class="section-eyebrow">Appointments &bull; Old Town</span>
        <h2 class="section-title">
          Book Your <span class="gold-italic">Appointment</span>
        </h2>
        <p class="section-subtitle">
          Select your services, preferred date, and stylist. Our team will prepare for your visit in Old Town, Bhubaneswar.
        </p>
      </div>

      <div class="inline-booking-card glass-card">
        <app-booking-wizard [isDrawerMode]="false"></app-booking-wizard>
      </div>
    </div>
  </section>

  <!-- 8. Memberships & Routine Care Packages (Kept lower on page) -->
  <app-packages></app-packages>

  <!-- 9. Visit Us, Map & Instant WhatsApp -->
  <app-concierge></app-concierge>
</main>

<!-- Architectural Footer -->
<app-footer></app-footer>

<!-- Slide-Over Appointment Booking Drawer (Accessible Modal Overlay) -->
@if (bookingService.isDrawerOpen()) {
  <div class="drawer-backdrop" (click)="closeDrawer()" role="presentation">
    <aside 
      class="drawer-panel" 
      (click)="$event.stopPropagation()"
      role="dialog" 
      aria-modal="true" 
      aria-label="Appointment Booking Drawer">
      <app-booking-wizard [isDrawerMode]="true"></app-booking-wizard>
    </aside>
  </div>
}
